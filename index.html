function bjDraw(bj){for(let t=0;t<200;t++){const x=[CR[cRnd(13)],CSU[cRnd(4)]];if(!bj.p.concat(bj.d).some(y=>y[0]==x[0]&&y[1]==x[1]))return x}return['2','♠']}
function bjDeal(){const c=cas(),err=cBetCheck(CS.bet,'bj');if(err){CS.note=err;return}if(c.bj&&!c.bj.done)return;const b=CS.bet;cTake(b,'Blackjack');const bj={bet:b,p:[],d:[],done:0,res:''};bj.p.push(bjDraw(bj));bj.d.push(bjDraw(bj));bj.p.push(bjDraw(bj));bj.d.push(bjDraw(bj));c.bj=bj;CS.note='';
 if(hv(bj.p)==21||hv(bj.d)==21)bjEnd('natural');else{try{save()}catch(e){}}openP('cas')}
function bjEnd(why){const c=cas(),bj=c.bj;if(!bj||bj.done)return;const pv=hv(bj.p),dv=hv(bj.d);let pay=0,res='';
 if(why=='natural'){if(pv==21&&dv==21){pay=bj.bet;res='Hòa (cả hai Blackjack)'}else if(pv==21){pay=Math.round(bj.bet*2.5);res='Blackjack! Trả 3:2'}else{res='Nhà cái Blackjack'}}
 else if(pv>21){res='Bạn quắc (>21)'}else{while(hv(bj.d)<17)bj.d.push(bjDraw(bj));const d2=hv(bj.d);if(d2>21||pv>d2){pay=bj.bet*2;res=d2>21?'Nhà cái quắc — bạn thắng':'Bạn thắng '+pv+' vs '+d2}else if(pv==d2){pay=bj.bet;res='Hòa '+pv}else res='Nhà cái thắng '+d2+' vs '+pv}
 bj.done=1;bj.res=res;bj.pay=pay;cPay(pay,'Blackjack: '+res);c.last={g:'bj',bet:bj.bet,pay};cAfter()}
function bjHit(){const c=cas(),bj=c.bj;if(!bj||bj.done)return;bj.p.push(bjDraw(bj));if(hv(bj.p)>=21)bjEnd(hv(bj.p)>21?'bust':'stand');else{try{save()}catch(e){}}openP('cas')}
function bjStand(){const c=cas();if(!c.bj||c.bj.done)return;bjEnd('stand');openP('cas')}

function bkMv(n){const b=bnk(),d=dayNum();if(b.mv.d!=d)b.mv={d,n:0};return b.mv.n+n<=BKCAP.day}

function bkSched(L){const per=Math.ceil(L.total/L.days),cum=[];let s=0;for(let i=1;i<=L.days;i++){s=i==L.days?L.total:Math.min(L.total,s+per);cum.push(s)}return cum}
function bkOwed(L,day){const cum=bkSched(L);let owed=0;for(let i=1;i<=L.days;i++)if(L.start+i<=day)owed=cum[i-1];return owed}
function bkNext(L){const cum=bkSched(L);for(let i=0;i<L.days;i++)if(cum[i]>L.paid)return{i:i+1,due:L.start+i+1,amt:cum[i]-L.paid};return null}

 if(dir=='in'){if(S.m<n){BKS.note='Tiền mặt không đủ.';return}S.m-=n;b.acc+=n;bkLog('in','Chuyển ví → tài khoản',n,-n)}else{if(b.acc<n){BKS.note='Số dư tài khoản không đủ.';return}b.acc-=n;S.m+=n;bkLog('out','Chuyển tài khoản → ví',-n,n)}

function bkSave(n){const b=bnk();n=Math.round(+n);if(!b.open){BKS.note='Hãy mở tài khoản trước.';return}if(!(n>0)){BKS.note='Số tiền không hợp lệ.';return}if(b.acc<n){BKS.note='Số dư tài khoản không đủ.';return}const cur=b.sav.filter(s=>s.st=='open').reduce((a,s)=>a+s.amt,0);if(cur+n>BKSV.cap){BKS.note='Tổng tiết kiệm tối đa '+fmt0(BKSV.cap)+'.';return}

 const d=dayNum(),L={id:bkId(b),pk:p.id,n:p.n,principal:p.amt,days:p.days,total:p.amt+bkInt(p.amt,p.days),paid:0,start:d,st:'open'};b.loans.push(L);b.acc+=p.amt;bkLog('loan','Nhận khoản vay '+p.n,p.amt,0);BKS.note='✅ Đã nhận '+fmt0(p.amt)+' vào tài khoản. Tổng phải trả '+fmt0(L.total)+'.';try{save()}catch(e){}}

 e=document.createElement('div');e.id='hpfd';e.style.cssText='position:fixed;inset:0;z-index:45;background:#000;opacity:0;pointer-events:none;display:flex;align-items:center;justify-content:center;color:#fff;font:600 22px Fredoka,sans-serif;text-align:center;padding:20px;transition:none';document.body.appendChild(e);
 const w=document.createElement('div');w.id='hpwarn';w.style.cssText='position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:40;font-size:34px;pointer-events:none;display:none;background:#d32f2fdd;border-radius:14px;padding:2px 12px';w.textContent='⚠️';document.body.appendChild(w);
 const o=document.createElement('div');o.id='hpobj';o.style.cssText='position:fixed;left:50%;top:calc(8px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;background:#0b3d40dd;color:#fff;border-radius:12px;padding:5px 12px;font:600 13px Fredoka,sans-serif;pointer-events:none;display:none;max-width:70vw;text-align:center';document.body.appendChild(o);
 const s=document.createElement('button');s.id='hpskip';s.className='b';s.textContent='Bỏ qua ⏭';s.style.cssText='position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:46;display:none';s.addEventListener('click',()=>{if(HC)HC.skip=1});document.body.appendChild(s);return e}
/* ===== Hóa đơn viện phí + thu ngân + công an (tình tiết mô phỏng trong game) ===== */
const HPC=()=>{const h=HPS();const c=(h.cfg&&typeof h.cfg=='object')?h.cfg:(h.cfg={});const D={fee:500000,fine:500000,warnSec:15,forceSec:30};for(const k in D){const v=Number(c[k]);c[k]=isFinite(v)&&v>=0?Math.round(v):D[k]}return c};
const HP_IVST=['UNPAID','PAYMENT_REQUESTED','LEFT_WITHOUT_PAYING','POLICE_WARNING','FINE_ISSUED','RESOLVED'],HP_IVVN={UNPAID:'Chưa thanh toán',PAYMENT_REQUESTED:'Đã được nhắc thanh toán',LEFT_WITHOUT_PAYING:'Đã rời viện khi chưa trả',POLICE_WARNING:'Công an đang xử lý',FINE_ISSUED:'Đã lập biên bản (cần trả phần còn lại)',RESOLVED:'Đã giải quyết'};
const hpInv=()=>{const h=HPS(),v=h.inv;if(!v||typeof v!='object')return null;if(!HP_IVST.includes(v.st))v.st='UNPAID';v.amt=Math.max(0,Math.round(+v.amt||0));v.paid=Math.max(0,Math.round(+v.paid||0));v.fine=Math.max(0,Math.round(+v.fine||0));return v};
const hpDue=v=>v?Math.max(0,v.amt+v.fine-v.paid):0;
function hpMakeInv(){const h=HPS(),c=HPC();let v=hpInv();if(v&&v.st!='RESOLVED')return v;h.invSeq=(h.invSeq|0)+1;return h.inv={id:'BV-'+String(h.invSeq).padStart(6,'0'),amt:c.fee,paid:0,fine:0,fined:0,fineId:'',warned:0,st:'UNPAID',day:dayNum()}}
let HM='intro';const HR={out:0,cd:0,polT:0,gone:0};
const hpPrem=(x,z)=>hpIn(x,z)||(x>=14&&x<=27&&z>=3.9&&z<=7);
const inShopZ=(x,z)=>z<5.6&&z>-5.6&&Math.abs(x)<6.5;
function hpObj(){hpUI();const h=HPS(),v=hpInv(),o=document.getElementById('hpobj');let t='';
 if(h.st=='HOSPITAL_QUEST')t=['Ngồi dậy khỏi giường','Nhận hóa đơn tại quầy lễ tân','Khám sức khỏe với bác sĩ Minh','Quay về tiệm'][Math.min(3,h.step)];
 else if(h.st=='RETURN_TO_RESTAURANT')t='Quay về tiệm pizza (ra cửa viện, đi theo hẻm bên trái về tiệm)';
 if(v&&v.st!='RESOLVED'&&h.st!='HOSPITAL_QUEST'){if(v.st=='POLICE_WARNING')t='🚔 Công an đang tiếp cận bạn — hãy dừng lại';else if(v.st=='FINE_ISSUED'||v.st=='LEFT_WITHOUT_PAYING'||v.st=='PAYMENT_REQUESTED'||v.st=='UNPAID')t=(t?t+' · ':'')+'Thanh toán viện phí tại Bệnh viện Bình An (còn '+fmt(hpDue(v))+')'}
 o.style.display=t?'block':'none';if(t)o.textContent='🏥 '+t}
/* lời thoại + hoạt ảnh: NPC quay mặt về người chơi và giơ tay khi nói */
function hpSpeak(who,text,npc){toast(who+': "'+text+'"',{ms:4200});if(npc){npc.sp=2.2}}
function hpAdvance(step){const h=HPS();if(h.st!='HOSPITAL_QUEST'||h.step!=step)return;
 if(step==0){h.step=1;hpSpeak('Y tá Lan','Bạn đã tỉnh rồi. Mời ra quầy nhận hóa đơn nhé.',HPNURSE);sfx(660,.1)}
 else if(step==2){h.step=3;h.st='RETURN_TO_RESTAURANT';hpSpeak('Bác sĩ Minh','Bạn khỏe rồi, không có gì nghiêm trọng. Nhớ thanh toán viện phí ở quầy thu ngân trước khi về nhé!',HPDOC);sfx(880,.2)}
 hpObj();try{save()}catch(e){}}
function hpPay(){const v=hpInv();if(!v||v.st=='RESOLVED')return;const due=hpDue(v);if(due<=0){hpResolve(v);return}const p=Math.min(due,Math.max(0,S.m|0));if(p<=0){toast('Bạn chưa có tiền để thanh toán');return}if(!spendMoney(p,'Viện phí'))return;v.paid+=p;sfx(660,.12);
 if(hpDue(v)<=0)hpResolve(v);else{toast('Đã trả '+fmt(p)+'. Còn lại '+fmt(hpDue(v))+' — hóa đơn vẫn được ghi nhận.');hpObj()}try{save()}catch(e){}}
function hpResolve(v){const was=v.st;v.st='RESOLVED';HR.out=0;HR.polT=0;hpPolice(null);hpSpeak(was=='FINE_ISSUED'?'Công an':'Thu ngân Hoa',was=='FINE_ISSUED'?'Vụ việc đã được giải quyết. Chúc anh/chị sức khỏe.':'Hóa đơn '+v.id+' đã thanh toán xong, cảm ơn ạ!',HPCASH);hpObj();try{save()}catch(e){}}
PNL.hosp=()=>{const h=HPS(),v=hpInv(),c=HPC(),I=(l,x)=>`<small>${l}: <b>${x}</b></small>`;
 if(HM=='intro')return `<div class=row><b>🚑 Bạn đã gặp tai nạn giao thông</b><small>Bạn được đưa vào Bệnh viện Bình An và chỉ bị choáng nhẹ. Không có gì nghiêm trọng. Đơn hàng, nhân viên và tiền của tiệm được giữ nguyên trong lúc bạn nằm viện.</small><small>Chi phí dự kiến: ${fmt(v?v.amt:c.fee)} VNĐ (bằng tiền trong game). Bạn sẽ nhận hóa đơn ở quầy và tự thanh toán ở quầy thu ngân — game không tự trừ tiền.</small></div><div class=row><b>📋 Nhiệm vụ</b><small>1) Ngồi dậy · 2) Nhận hóa đơn ở quầy · 3) Khám với bác sĩ · 4) Quay về tiệm (nhớ thanh toán viện phí).</small><button class=b data-hps="ok">Đã hiểu</button></div>`;
 if(HM=='ack'&&v)return `<div class=row><b>📋 Hóa đơn viện phí ${v.id}</b>${I('Chi phí khám & điều trị',fmt(v.amt)+' VNĐ')}${I('Đã thanh toán',fmt(v.paid)+' VNĐ')}<small>Hóa đơn chưa bị trừ tiền. Bạn thanh toán trực tiếp tại <b>quầy thu ngân</b> (bên phải, gần cửa). Nếu rời viện mà chưa trả, nhân viên sẽ nhắc và có thể báo công an trong nhiệm vụ này.</small><button class=b data-hps="ack">Đã hiểu, nhận hóa đơn</button></div>`;
 if(HM=='pay'&&v&&v.st!='RESOLVED'){const due=hpDue(v),can=Math.min(due,Math.max(0,S.m|0));return `<div class=row><b>💳 Thanh toán viện phí</b>${I('Hóa đơn',v.id)}${I('Viện phí',fmt(v.amt)+' VNĐ')}${v.fine?I('Tiền phạt biên bản '+v.fineId,fmt(v.fine)+' VNĐ'):''}${I('Đã trả',fmt(v.paid)+' VNĐ')}${I('Còn phải trả',fmt(due)+' VNĐ')}${I('Tiền hiện có',fmt(S.m)+' VNĐ')}${can<due?'<small>Bạn chưa đủ tiền trả hết: có thể trả một phần, phần còn lại vẫn được ghi nhận (không bao giờ làm tiền bị âm).</small>':''}<button class=b data-hps="pay" ${can>0?'':'disabled'}>Xác nhận thanh toán ${fmt(can)}</button><button class=b data-hps="x">Để sau</button></div>`}
 if(HM=='pol1')return `<div class=row><b>🚔 Công an</b><small>“Chúng tôi nhận được thông tin về việc chưa hoàn tất khoản viện phí trong nhiệm vụ này. Mời anh/chị dừng lại để giải quyết sự việc.”</small><small>(Tình tiết mô phỏng trong game.)</small><button class=b data-hps="pol2">Nghe công an</button></div>`;
 if(HM=='pol2'&&v)return `<div class=row><b>🚔 Xử lý vụ việc</b><small>Lý do: bỏ qua yêu cầu thanh toán viện phí trong nhiệm vụ (hóa đơn ${v.id}).</small>${v.warned||HR.forced?`<small>Khoản phạt trong game: <b>${fmt(c.fine)} VNĐ</b>. Phạt chỉ ghi nhận một lần. Nếu chưa đủ tiền, phần còn lại được ghi nhận để trả sau ở quầy thu ngân.</small><button class=b data-hps="fine">Xác nhận khoản phạt ${fmt(c.fine)}</button>`:`<small>Đây là lần nhắc đầu: bạn có thể quay lại quầy thanh toán ngay mà không bị phạt.</small><button class=b data-hps="back">Quay lại quầy thanh toán</button>`}</div>`;
 return `<div class=row><small>Không có thủ tục nào đang chờ.</small></div>`};
TTL.hosp='🏥 Bệnh viện Bình An';
function hpToCashier(msg){P.x=HPCASH_P[0];P.z=1.5;P.y=0;yaw=Math.PI;pit=0;hpFd(1,'');HFD={t:.3};HLK=0;if(msg)hpSpeak('Thu ngân Hoa',msg,HPCASH)}
function hpFineApply(){const v=hpInv(),c=HPC();if(!v||v.fined)return;v.fined=1;v.fine=c.fine;v.fineId='PT-'+v.id.slice(3);const p=Math.min(v.fine,Math.max(0,S.m|0));if(p>0&&spendMoney(p,'Tiền phạt viện phí'))v.paid+=p;v.st='FINE_ISSUED';toast('⚖️ Bạn đã bị xử lý vì bỏ qua yêu cầu thanh toán viện phí trong nhiệm vụ. Phạt '+fmt(v.fine)+(p<v.fine?' (mới trả '+fmt(p)+', còn ghi nhận '+fmt(v.fine-p)+')':''),{cls:'warn',ms:5200});try{save()}catch(e){}}
const _m5h=m5Click;m5Click=function(D){if(D.hps!=null){if(PN!='hosp')return true;const h=HPS(),v=hpInv(),a=D.hps;
  if(a=='ok'&&HM=='intro'){h.intro=0;if(h.st=='HOSPITAL_ARRIVAL'){h.st='HOSPITAL_QUEST';h.step=0}closeP();HLK=0;hpObj();try{save()}catch(e){}}
  else if(a=='ack'&&h.st=='HOSPITAL_QUEST'&&h.step==1){h.step=2;closeP();toast('Đã nhận hóa đơn. Hãy gặp bác sĩ Minh.');hpObj();try{save()}catch(e){}}
  else if(a=='pay'&&HM=='pay'){hpPay();if(v&&v.st!='RESOLVED'&&PN=='hosp')openP('hosp');else closeP()}
  else if(a=='x')closeP();
  else if(a=='pol2'&&HPOL){HM='pol2';openP('hosp')}
  else if(a=='fine'&&HPOL&&HM=='pol2'){hpFineApply();closeP();hpPoliceLeave('Mời anh/chị quay lại quầy thu ngân để giải quyết phần còn lại.')}
  else if(a=='back'&&HPOL&&HM=='pol2'){if(v){v.warned=1;v.st='PAYMENT_REQUESTED';HR.cd=20;HR.out=0}closeP();hpPoliceLeave('Anh/chị hãy thanh toán ngay nhé.')}
  return true}return _m5h(D)};
(function(){const _q=PNL.qst;PNL.qst=()=>_q()+hpQuestHTML()})();
function hpQuestHTML(){const h=HPS(),v=hpInv();if(!h.n&&h.st=='NORMAL'&&!v)return'';const L=['Ngồi dậy khỏi giường','Nhận hóa đơn tại quầy lễ tân','Khám sức khỏe với bác sĩ','Quay về tiệm'];let s=`<div class=row><b>🏥 Nhiệm vụ: Sau tai nạn</b>`;
 if(h.st=='NORMAL')s+=`<small>✅ Đã hoàn thành phần điều trị. Số lần được đưa vào viện: ${h.n}. Hãy qua đường ở vạch dành cho người đi bộ nhé.</small>`;
 else{const k=h.st=='RETURN_TO_RESTAURANT'?3:Math.min(3,h.step);s+=L.map((t,i)=>`<small>${i<k?'✅':i==k?'👉':'⬜'} ${t}</small>`).join('')}
 if(v)s+=`<small>🧾 Hóa đơn ${v.id}: ${HP_IVVN[v.st]}${v.st!='RESOLVED'?' · còn '+fmt(hpDue(v)):''}${v.fine?' · phạt '+fmt(v.fine)+' ('+v.fineId+')':''}</small>`;return s+`</div>`}
/* --- công an --- */
const hpOkPos=(x,z)=>inRoom(x,z)&&!COL.some(b=>x>b[0]&&x<b[1]&&z>b[2]&&z<b[3]);
function hpPolice(m){if(m===null){if(HPOL){try{sc.remove(HPOL.g)}catch(e){}HPOL=null}return}
 if(m!='spawn'||HPOL)return;const g=hum('#e0b080','#3f6b3a','#2f4a2f');bx(g,.62,.16,.62,'#2f4a2f',0,2.02,0);bx(g,.16,.16,.05,'#d32f2f',-.15,1.25,.16,1);
 let pos=null;for(const r of[9,8,10,7,11,6,5])for(let i=0;i<12&&!pos;i++){const a=i/12*6.283+yaw,x=P.x+Math.sin(a)*r,z=P.z+Math.cos(a)*r;if(hpOkPos(x,z)&&!inShopZ(x,z)&&!hpIn(x,z))pos=[x,z]}
 if(!pos)pos=[P.x+(hpOkPos(P.x,P.z+2)?0:2),P.z+2.5];g.position.set(pos[0],0,pos[1]);sc.add(g);HPOL={g,t:0,st:'walk',far:0,leave:0};HR.forced=0;toast('🚔 Có công an đang tiến tới bạn — hãy dừng lại',{cls:'warn',ms:4200});hpObj()}
function hpPoliceLeave(line){const p=HPOL;if(p){p.st='leave';p.leave=2.2;hpSpeak('Công an',line,null)}hpToCashier(null);HR.out=0;HR.polT=0;hpObj();try{save()}catch(e){}}
function hpPoliceTick(dt,v,c){const p=HPOL;if(!p)return;const g=p.g,dx=P.x-g.position.x,dz=P.z-g.position.z,d=Math.hypot(dx,dz);
 if(p.st=='leave'){p.leave-=dt;g.position.z+=dt*2;if(p.leave<=0)hpPolice(null);return}
 if(p.st=='talk')return;
 if(PN||CUT||HLK)return;if(inShopZ(P.x,P.z)||hpIn(P.x,P.z))return;/* chờ khi người chơi đang trong tiệm/viện */
 p.t+=dt;g.rotation.y=Math.atan2(dx,dz);
 if(d>1.8){const sp=3.5*dt,nx=g.position.x+dx/d*sp,nz=g.position.z+dz/d*sp;if(hpOkPos(nx,nz)||W_.walk(nx,nz)){g.position.x=nx;g.position.z=nz}else if(hpOkPos(nx,g.position.z))g.position.x=nx;else if(hpOkPos(g.position.x,nz))g.position.z=nz;const w=Math.sin(p.t*10);g.legs[0].rotation.x=w*.6;g.legs[1].rotation.x=-w*.6;g.arms[0].rotation.x=-w*.5;g.arms[1].rotation.x=w*.5}
 p.far=d>26?p.far+dt:0;
 if(d<=2.2||p.t>c.forceSec||p.far>6){HR.forced=(d>2.2)?1:0;if(HR.forced){/* chặn đường: đưa police tới trước mặt */const a=yaw;g.position.set(P.x+Math.sin(a)*1.6,0,P.z+Math.cos(a)*1.6);if(!hpOkPos(g.position.x,g.position.z))g.position.set(P.x,0,P.z+1.4)}
  p.st='talk';HLK=1;g.rotation.y=Math.atan2(P.x-g.position.x,P.z-g.position.z);HM='pol1';openP('hosp');hpSpeak('Công an','Mời anh/chị dừng lại để giải quyết hóa đơn viện phí.',null)}}
/* --- máy trạng thái hóa đơn (mỗi lúc chỉ 1 trạng thái; chờ khi đang hội thoại/hoạt cảnh) --- */
function hpInvTick(dt,h){const v=hpInv(),c=HPC();if(!v||v.st=='RESOLVED'){if(HPOL)hpPolice(null);return}
 if(h.st=='ACCIDENT_EVENT'||h.st=='HOSPITAL_ARRIVAL')return;
 const busy=!!(PN||CUT||HLK||HC),prem=hpPrem(P.x,P.z),HI=hpIn(P.x,P.z);HR.cd=Math.max(0,HR.cd-dt);
 if(HPOL&&v.st!='POLICE_WARNING'&&v.st!='FINE_ISSUED'){if(HPOL.st=='leave')hpPoliceTick(dt,v,c);else hpPolice(null)}
 if(v.st=='UNPAID'||v.st=='PAYMENT_REQUESTED'){
  if(!busy&&HR.cd<=0&&HI&&(h.st!='HOSPITAL_QUEST'||h.step>=2)){
   if(v.st=='UNPAID'&&Math.hypot(P.x-HPCASH_P[0],P.z-HPCASH_P[1])<3.2){hpSpeak('Thu ngân Hoa','Anh/chị ơi, hóa đơn viện phí của mình vẫn chưa thanh toán ạ!',HPCASH);v.st='PAYMENT_REQUESTED';HR.cd=20;hpObj();try{save()}catch(e){}}
   else if(P.z>2.0&&P.x>19.2&&P.x<22.8){hpSpeak('Thu ngân Hoa','Anh/chị vui lòng quay lại quầy để hoàn tất viện phí trước khi rời đi!',HPCASH);v.st='PAYMENT_REQUESTED';HR.cd=20;hpObj();try{save()}catch(e){}}}
  if(!prem&&!busy){HR.out+=dt;if(HR.out>=3){if(v.st=='UNPAID'){v.st='PAYMENT_REQUESTED';toast('🏥 Bệnh viện nhắc: bạn chưa thanh toán viện phí '+fmt(hpDue(v)),{ms:4200});HR.out=0}else{v.st='LEFT_WITHOUT_PAYING';HR.out=0;HR.polT=0;hpSpeak('Thu ngân Hoa','Anh/chị chưa thanh toán hóa đơn viện phí. Vui lòng quay lại quầy để giải quyết!',HPCASH);hpObj();try{save()}catch(e){}}}}else if(prem)HR.out=0}
 else if(v.st=='LEFT_WITHOUT_PAYING'){if(prem){v.st='PAYMENT_REQUESTED';HR.out=0;HR.cd=10;hpObj()}else if(!busy&&!inShopZ(P.x,P.z)){HR.polT+=dt;if(HR.polT>=c.warnSec){v.st='POLICE_WARNING';HR.polT=0;hpPolice('spawn');try{save()}catch(e){}}}}
 else if(v.st=='POLICE_WARNING'){if(!HPOL&&!busy&&!inShopZ(P.x,P.z))hpPolice('spawn');hpPoliceTick(dt,v,c)}
 else if(v.st=='FINE_ISSUED'){if(HPOL)hpPoliceTick(dt,v,c)}}
/* hoạt ảnh NPC bệnh viện: quay về phía người chơi khi gần, giơ tay khi nói, thở nhẹ khi rảnh */
function hpAnim(dt){for(const n of[HPNURSE,HPDOC,HPCASH]){if(!n||!n.arms)continue;const dx=P.x-n.position.x,dz=P.z-n.position.z,d=Math.hypot(dx,dz),t=performance.now()/1000;
  if(d<7&&hpIn(P.x,P.z)){const a=Math.atan2(dx,dz);let df=a-n.rotation.y;df=Math.atan2(Math.sin(df),Math.cos(df));n.rotation.y+=df*Math.min(1,dt*5)}
  if(n.sp>0){n.sp-=dt;n.arms[0].rotation.x=-1.9+Math.sin(t*9)*.25;n.arms[1].rotation.x=-.3}else{n.arms[0].rotation.x=Math.sin(t*1.3)*.06;n.arms[1].rotation.x=-Math.sin(t*1.3)*.06}}}
/* --- chuỗi sự kiện --- */
let HFD=null,hpOpened=0;
const hpFd=(a,txt,bg)=>{const e=hpUI();e.style.opacity=a;e.style.background=bg||'#000';if(txt!=null)e.textContent=txt};
function hpStart(v){const h=HPS();if(h.st!='NORMAL')return false;h.st='ACCIDENT_EVENT';h.tm0=S.tm;h.step=0;h.cd=HPCD;HLK=1;HC={t:0,skip:0,ban:0};hpOpened=0;
 for(const o of W_.VEH){if(Math.hypot(o.x-P.x,o.z-P.z)<14)o.hold=5}
 tone(110,.3,'triangle',.1,'veh');tone(70,.4,'triangle',.08,'veh');
